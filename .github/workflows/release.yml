name: Build and release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: allen-toolbox-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - name: Check sources
        run: npm run check
      - name: Run regression tests
        run: npm test
      - name: Build linked release ZIP
        run: npm run release
      - name: Upload tested package
        uses: actions/upload-artifact@v7.0.2
        with:
          name: allen-toolbox-package
          path: dist/*
          if-no-files-found: error
      - name: Publish or resume complete release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/publish-release.mjs
